[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samecut"
version = "0.1.0"
description = "Local reference-driven photo edits: share link + your assets → MP4"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10.4,<13", "yt-dlp>=2026.10.21"]

[project.scripts]
samecut = "samecut.cli:main"

[tool.setuptools.package-data]
samecut = ["static/*.html"]

[tool.setuptools.packages.find]
include = ["samecut*"]
